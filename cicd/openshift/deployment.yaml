apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dac-web-storage
  labels:
    app: dac-web
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dac-web
  labels:
    app: dac-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dac-web
  template:
    metadata:
      labels:
        app: dac-web
    spec:
      containers:
        - name: dac-web
          image: image-registry.openshift-image-registry.svc:5000/dac/dac-web:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: dac-web-config
                optional: true
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: storage
              mountPath: /app/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: dac-web-storage
---
apiVersion: v1
kind: Service
metadata:
  name: dac-web
  labels:
    app: dac-web
spec:
  selector:
    app: dac-web
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dac-web
  labels:
    app: dac-web
spec:
  to:
    kind: Service
    name: dac-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
